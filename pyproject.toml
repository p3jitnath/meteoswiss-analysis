[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meteoswiss-analysis"
version = "0.1.0"
description = "Reproducible Swiss summer-temperature distributions from MeteoSwiss open data"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Pritthijit Nath"}]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
meteoswiss-analysis = "meteoswiss_analysis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meteoswiss_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "NPY"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
